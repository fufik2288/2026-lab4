Вопрос 5. На SW5 корневым портом для всех VLAN выбран Fa0/1.
Если SW5 получает BPDU с одинаковой стоимостью пути и одинаковым Bridge ID соседнего коммутатора, STP сравнивает ID порта соседа, с которого пришла BPDU. Выбирается BPDU с меньшим ID порта. Поэтому среди параллельных соединений SW1–SW5 выбирается путь через порт SW1 Fa0/1, а корневым портом на SW5 становится Fa0/1.
